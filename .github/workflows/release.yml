name: Build downloadable app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --win nsis --x64 --publish always

      - name: Create source ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          mkdir -p release
          git archive \
            --format=zip \
            --prefix=zhixing-study-app/ \
            --output="release/zhixing-study-app-${VERSION}.zip" \
            HEAD

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhixing-study-app-${{ github.ref_name }}
          path: |
            release/*.zip
            release/desktop/*.exe
