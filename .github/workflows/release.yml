name: Build downloadable app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create downloadable ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          mkdir -p release
          git archive \
            --format=zip \
            --prefix=zhixing-study-app/ \
            --output="release/zhixing-study-app-${VERSION}.zip" \
            HEAD

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhixing-study-app-${{ github.ref_name }}
          path: release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip --generate-notes --verify-tag
