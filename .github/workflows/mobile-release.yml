name: Build mobile apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare web assets
        working-directory: mobile
        run: node scripts/prepare-web.mjs
      - name: Install Capacitor
        working-directory: mobile
        run: npm install
      - name: Add and sync Android
        working-directory: mobile
        run: npx cap add android && npx cap sync android
      - name: Configure Android version and branding
        working-directory: mobile
        env:
          MOBILE_APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.3.2' }}
        run: node scripts/configure-android.mjs
      - name: Configure Android release signing
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks
          cat >> gradle.properties <<EOF
          ZHIXING_RELEASE_STORE_FILE=release.jks
          ZHIXING_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          ZHIXING_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          ZHIXING_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed Release APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify installable APK contains the complete app
        shell: bash
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q "assets/public/index.html"
          test "$(stat -c%s "$APK")" -gt 5000000
      - name: Rename APK
        shell: bash
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk release-Zhixing-Study-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: zhixing-android, path: release-Zhixing-Study-Android.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { tag_name: '${{ github.ref_name }}', files: release-Zhixing-Study-Android.apk }
        env: { GITHUB_TOKEN: '${{ github.token }}' }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare web assets
        working-directory: mobile
        run: node scripts/prepare-web.mjs
      - name: Install and add iOS platform
        working-directory: mobile
        run: npm install && npx cap add ios && npx cap sync ios
      - name: Build unsigned iOS archive
        working-directory: mobile
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with: { name: zhixing-ios-unsigned, path: mobile/App.xcarchive }
