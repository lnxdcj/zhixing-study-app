name: Build Android app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build APK
        working-directory: mobile/android
        run: gradle assembleDebug
      - name: Rename APK
        shell: bash
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-Zhixing-Study-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: zhixing-android, path: release-Zhixing-Study-Android.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { tag_name: '${{ github.ref_name }}', files: release-Zhixing-Study-Android.apk }
        env: { GITHUB_TOKEN: '${{ github.token }}' }
