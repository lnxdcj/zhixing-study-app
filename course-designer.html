<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>详细研学方案设计器 · 知行研学</title>
  <link rel="stylesheet" href="./assets/course-designer.css?v=2">
</head>
<body>
  <header><a href="./index.html#/home" aria-label="返回首页">‹</a><div><h1>研学课程设计器</h1><p>从主题构想到现场执行</p></div></header>
  <main>
    <section class="intro"><span class="eyebrow">详细执行版</span><h2>不只列行程，把每一步讲清楚</h2><p>生成逐日日程、活动任务卡、人员分工、物资清单、预算分配、评价量规与安全备选。按人群、主题和时长调整；尚未核实的现场条件会单独列出。</p></section>
    <form id="designer-form">
      <section class="field"><label for="topic">关键词 / 主题</label><input id="topic" name="topic" maxlength="120" placeholder="例如：生态文明、工业遗产、乡村振兴"></section>
      <section class="field"><label for="location">地点 / 场域</label><input id="location" name="location" maxlength="120" placeholder="例如：苏州园林、某社区或企业"></section>
      <section class="field"><label for="audience">适用人群</label><select id="audience" name="audience"></select></section>
      <section class="field"><label for="courseType">课程类型</label><select id="courseType" name="courseType"></select></section>
      <section class="field"><label for="duration">课程时长</label><select id="duration" name="duration"></select></section>
      <section class="field"><label for="mode">组织形式</label><select id="mode" name="mode"></select></section>
      <section class="field"><label for="participants">参与人数</label><input id="participants" name="participants" type="number" min="1" max="500" step="1" placeholder="未填按30名学习者规划"><small>用于分组、物资和预算计算，不含带队人员。</small></section>
      <section class="field"><label for="groupSize">每组最多人数</label><input id="groupSize" name="groupSize" type="number" min="1" max="12" step="1" placeholder="未填按人群建议值规划"><small>分组不代替主办方核定师生及保障配比。</small></section>
      <section class="field"><label for="budget">人均预算上限（元，可选）</label><input id="budget" name="budget" type="number" min="1" max="100000" step="1" placeholder="例如：500"><small>只做预算上限分配，不生成未经核实的报价。</small></section>
      <section class="field"><label for="departure">出发地（可选）</label><input id="departure" name="departure" maxlength="120" placeholder="例如：学校或单位集合点"><small>未查询路况；日程从场域集合开始。</small></section>
      <fieldset><legend>设计重点（最多6项）</legend><div class="checks" id="emphasis"></div></fieldset>
      <fieldset><legend>活动方法（最多6项）</legend><div class="checks" id="methods"></div><small>方法越多，单项时间越短；半天建议选择2至3项。</small></fieldset>
      <section class="field wide"><label for="needs">补充需求 / 待确认约束（可选）</label><textarea id="needs" name="needs" maxlength="1000" rows="3" placeholder="例如：需要无障碍路线、以调查报告为成果、部分成员需要低体力任务。会纳入主办方确认清单，不自动认定条件已满足。"></textarea></section>
      <div class="actions"><button class="submit" type="submit">生成详细执行方案</button></div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <div id="result" tabindex="-1" aria-label="生成的详细研学方案"></div>
    <noscript><p>请启用 JavaScript 后使用方案设计器。</p></noscript>
  </main>
  <script type="module" src="./assets/course-designer.mjs?v=2"></script>
</body>
</html>
